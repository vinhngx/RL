# GRPO baseline on Qwen3-1.7B with DAPO-Math-17K (single-GPU research A/B vs OAPL).
defaults: grpo_math_1B.yaml

checkpointing:
  checkpoint_dir: results/grpo_dapo_qwen3_1p7b

policy:
  model_name: "Qwen/Qwen3-1.7B"
  train_global_batch_size: 128
  train_micro_batch_size: 2
  logprob_batch_size: 2
  logprob_chunk_size: 2048
  dynamic_batching:
    enabled: true
  sequence_packing:
    enabled: false
  max_total_sequence_length: 2048
  dtensor_cfg:
    activation_checkpointing: true
    lora_cfg:
      enabled: true
  optimizer:
    kwargs:
      lr: 1.0e-6
      betas: [0.9, 0.95]
      weight_decay: 0.0
  max_grad_norm: 1.0
  generation:
    max_new_tokens: 768
    temperature: 1.0
    top_p: 1.0

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  normalize_rewards: true
  use_leave_one_out_baseline: true
  adv_estimator:
    name: "grpo"
    normalize_rewards: true
    use_leave_one_out_baseline: true
  val_period: 25
  val_batch_size: 32
  val_at_end: true
  val_at_start: true

data:
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: "examples/prompts/cot.txt"
    processor: "math_hf_data_processor"
    env_name: "math"

env:
  math:
    num_workers: 8
    math_verify_impl: "hf_math_verify"

logger:
  tensorboard_enabled: false
  wandb_enabled: false

cluster:
  gpus_per_node: 1
