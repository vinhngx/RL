# Re-test spatial process reward after the VLM system-role parity fix, from the
# 190/200 leader. The decoder stays frozen; only vision features can change.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_quadrant_process_from_93_v06.yaml

grpo:
  max_num_steps: 8
  val_period: 1

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/deployment-matched-quadrant-process-from-950/checkpoints
  save_period: 1
  keep_top_k: 8

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
    chat_template: default
    chat_template_kwargs:
      enable_thinking: false
  dtensor_cfg:
    activation_checkpointing: false
    lora_cfg:
      enabled: true
      target_modules:
        - "*visual*attn.qkv"
        - "*visual*attn.proj"
        - "*visual*linear_fc1"
        - "*visual*linear_fc2"
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  optimizer:
    kwargs:
      lr: 2.5e-7

data:
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/quadrant-process-reward-from-93/data/train-quadrant-process.jsonl
  default:
    prompt_file: null
    system_prompt_file: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/prompt_gym_boxed.txt

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/deployment-matched-quadrant-process-from-950/logs
  wandb:
    name: deployment-matched-quadrant-process-from-950
