defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_vlm_group_id_dynamic_from_950_v06.yaml

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/vlm-proximity-dynamic-grpo-from-950/checkpoints

env:
  circle-count:
    num_workers: 4
    reward_functions:
      - name: boxed_numeric_proximity
        weight: 1.0
        kwargs:
          decay: 0.5

