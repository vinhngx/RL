# Low-rate asymmetric GRPO on a fresh, count-balanced natural Gym pool.  The
# current deployment leader's residuals are predominantly one-circle
# undercounts, so undercounts receive a stronger penalty than overcounts while
# exact boxed answers remain the only positive outcome.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  max_num_steps: 4
  val_period: 1
  val_at_start: false
  val_at_end: true
  max_val_samples: 64
  seed: 137
  use_dynamic_sampling: true
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 2

loss_fn:
  reference_policy_kl_penalty: 0.20

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/asymmetric-natural-from-950/checkpoints
  save_period: 1
  keep_top_k: 4

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 5.0e-8
  generation:
    max_new_tokens: 128

data:
  shuffle: true
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-hard-negatives-from-950/data/candidate-pool.jsonl

env:
  circle-count:
    num_workers: 4
    reward_functions:
      - name: boxed_numeric_asymmetric
        weight: 1.0

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/asymmetric-natural-from-950/logs
  wandb:
    name: asymmetric-natural-grpo-from-950
