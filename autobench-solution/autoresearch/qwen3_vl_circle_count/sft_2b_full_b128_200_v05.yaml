defaults: ../../sft.yaml

sft:
  # 256 examples give two global-batch updates per epoch. Run 100 epochs so
  # max_num_steps, rather than the epoch limit, controls this experiment.
  max_num_epochs: 100
  max_num_steps: 200
  val_period: 1
  val_batches: 1
  val_global_batch_size: 16
  val_micro_batch_size: 1
  val_at_start: false
  val_at_end: false
  seed: 42
  only_unmask_final: false

checkpointing:
  enabled: true
  checkpoint_dir: /runstate/checkpoints
  metric_name: val:val_loss
  higher_is_better: false
  keep_top_k: 2
  save_period: 1
  checkpoint_must_save_by: null
  save_optimizer: false

policy:
  model_name: Qwen/Qwen3-VL-2B-Instruct
  tokenizer:
    name: ${policy.model_name}
    chat_template: default
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 128
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  precision: bfloat16
  make_sequence_length_divisible_by: 1

  dtensor_cfg:
    enabled: false

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false

  megatron_cfg:
    enabled: true
    activation_checkpointing: false
    use_fused_linear_logprobs: false
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    empty_unused_memory_level: 1
    apply_rope_fusion: true
    bias_activation_fusion: false
    # Intentionally no freeze_config: update the full 2B vision-language model.
    optimizer:
      lr: 1.0e-7
      min_lr: 1.0e-8
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
    scheduler:
      lr_warmup_iters: 4
      lr_warmup_init: 1.0e-8
      lr_decay_style: cosine
      lr_decay_iters: 200
    distributed_data_parallel_config:
      overlap_grad_reduce: false
      overlap_param_gather: false

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 0
  dataset_name: openai_format
  train_data_path: /runstate/sft-data/train.jsonl
  val_data_path: /runstate/sft-data/validation.jsonl
  chat_key: messages
  system_key: null
  system_prompt: null
  tool_key: tools
  use_preserving_dataset: true
  prompt_file: null
  split: null
  output_key: null
  seed: null

logger:
  log_dir: /runstate/logs
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: qwen3-vl-circle-count-autoresearch
    name: sft-2b-full-b128-200

cluster:
  gpus_per_node: 1
  num_nodes: 1
  segment_size: null
