defaults: ../../sft.yaml

sft:
  # 256 examples give two global-batch updates per epoch. The committed recipe
  # expresses the requested 200 steps; bounded launches may override this.
  max_num_epochs: 100
  max_num_steps: 200
  val_period: 1
  val_batches: 1
  val_global_batch_size: 16
  val_micro_batch_size: 1
  val_at_start: false
  val_at_end: false
  seed: 42
  only_unmask_final: false

checkpointing:
  enabled: true
  checkpoint_dir: /runstate/checkpoints
  metric_name: val:val_loss
  higher_is_better: false
  keep_top_k: 2
  save_period: 1
  checkpoint_must_save_by: null
  save_optimizer: false

policy:
  model_name: Qwen/Qwen3-VL-2B-Instruct
  tokenizer:
    name: ${policy.model_name}
    chat_template: default
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 128
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  precision: bfloat16
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  dtensor_cfg:
    _v2: true
    enabled: true
    env_vars: {}
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false

  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 1.0e-7
      weight_decay: 0.1
      betas: [0.9, 0.98]
      eps: 1.0e-5
      foreach: false
      fused: false

  scheduler:
    - name: torch.optim.lr_scheduler.LinearLR
      kwargs:
        start_factor: 0.1
        end_factor: 1.0
        total_iters: 4
    - name: torch.optim.lr_scheduler.CosineAnnealingLR
      kwargs:
        T_max: 196
        eta_min: 1.0e-8
    - milestones: [4]

  megatron_cfg:
    enabled: false

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 0
  dataset_name: openai_format
  train_data_path: /runstate/sft-data/train.jsonl
  val_data_path: /runstate/sft-data/validation.jsonl
  chat_key: messages
  system_key: null
  system_prompt: null
  tool_key: tools
  use_preserving_dataset: true
  prompt_file: null
  split: null
  output_key: null
  seed: null

logger:
  log_dir: /runstate/logs
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: qwen3-vl-circle-count-autoresearch
    name: sft-2b-full-b128-200-dtensor

cluster:
  gpus_per_node: 1
  num_nodes: 1
  segment_size: null
