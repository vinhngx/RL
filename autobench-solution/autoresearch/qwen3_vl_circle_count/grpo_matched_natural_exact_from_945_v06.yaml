# Exact GRPO on the task's natural Gym distribution after correcting VLM
# system-prompt handling.  A low LR and per-step selection limit drift from the
# promoted 189/200 parent.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  max_num_steps: 6
  val_period: 1
  val_at_start: true
  val_at_end: true

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/matched-natural-exact-grpo/checkpoints
  save_period: 1
  keep_top_k: 6

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/matched-prompt-model-mined-grpo/merged-parent
  tokenizer:
    name: ${policy.model_name}
    chat_template: default
    chat_template_kwargs:
      enable_thinking: false
  optimizer:
    kwargs:
      lr: 2.5e-7

data:
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/natural-balanced-vlm-dpo-from-935/data/natural-pool-8192.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/matched-natural-exact-grpo/logs
  wandb:
    name: matched-natural-exact-grpo-from-945
