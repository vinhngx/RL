# GDPO continuation from the 190/200 leader. Exact boxed correctness and
# same-geometry +1 consistency remain separate during advantage normalization.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_pair_consistency_from_950_v06.yaml

grpo:
  max_num_steps: 4
  val_period: 1
  val_at_start: true
  counterfactual_pair_reward:
    enabled: true
    weight: 0.25
    gdpo_components: true
  adv_estimator:
    name: gdpo
    normalize_rewards: true
    use_leave_one_out_baseline: false
    reward_weights: [1.0, 0.25]

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-gdpo-from-950/checkpoints
  keep_top_k: 4

data:
  shuffle: false
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-paired-counterfactual-from-950/data/train.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-gdpo-from-950/logs
  wandb:
    name: counterfactual-gdpo-from-950
