# Exact GRPO on high-density adjacent-count pairs whose changed target circle
# is the circle nearest an image edge. Deployment prompt/layout remain exact.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_counterfactual_pairs_from_945_v06.yaml

grpo:
  max_num_steps: 6
  val_period: 1

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/edge-counterfactual-grpo-from-950/checkpoints
  save_period: 1
  keep_top_k: 6

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 1.25e-7

data:
  shuffle: false
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/edge-counterfactual-grpo-from-950/data/train.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/edge-counterfactual-grpo-from-950/logs
  wandb:
    name: edge-counterfactual-grpo-from-950
