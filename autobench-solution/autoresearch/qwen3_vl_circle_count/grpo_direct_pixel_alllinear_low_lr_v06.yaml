# Dense pixel-localization GRPO directly from the robust 94% leader.
# A low-rate all-linear adapter lets grounding updates reach the answer path
# while the stronger KL constraint limits the decoder drift seen after SFT.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_pixel_location_from_94_v06.yaml

loss_fn:
  reference_policy_kl_penalty: 0.20

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/direct-pixel-alllinear-low-lr/checkpoints

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/direction-matched-vlm-dpo-from-94/merged-parent
  optimizer:
    kwargs:
      lr: 2.0e-7

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/direct-pixel-alllinear-low-lr/logs
  wandb:
    name: direct-pixel-alllinear-low-lr
