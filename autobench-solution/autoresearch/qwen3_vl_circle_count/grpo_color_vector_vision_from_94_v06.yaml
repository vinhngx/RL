# Vision-only GRPO on dense, directly count-aligned all-color supervision.
# The merged SFT model supplies the rollout protocol; the resulting visual delta
# is also evaluated on the untouched 188/200 parent to avoid decoder regression.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_direct_pixel_vision_from_94_v06.yaml

grpo:
  max_num_steps: 16

loss_fn:
  reference_policy_kl_penalty: 0.10

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/color-vector-process-reward/grpo-checkpoints
  keep_top_k: 9

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/color-vector-process-reward/merged-lr2e5-step16
  dtensor_cfg:
    lora_cfg:
      enabled: true
      target_modules:
        - "*visual*attn.qkv"
        - "*visual*attn.proj"
        - "*visual*linear_fc1"
        - "*visual*linear_fc2"
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  optimizer:
    kwargs:
      lr: 1.0e-6

data:
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/color-vector-process-reward/data/train.jsonl
  validation:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/color-vector-process-reward/data/validation.jsonl
  default:
    prompt_file: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/prompt_color_vector.txt

env:
  circle-count:
    num_workers: 4
    reward_functions:
      - name: color_vector
        weight: 1.0

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/color-vector-process-reward/grpo-logs
  wandb:
    name: color-vector-vision-grpo-from-94
