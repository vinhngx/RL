# Deployment-matched DPO with updates restricted to the Qwen3-VL vision tower.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/dpo_system_matched_direction_from_945_v06.yaml

dpo:
  max_num_steps: 12
  val_period: 2

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/system-matched-vision-dpo/checkpoints
  save_period: 2
  keep_top_k: 6

policy:
  dtensor_cfg:
    lora_cfg:
      enabled: true
      target_modules:
        - "*visual*attn.qkv"
        - "*visual*attn.proj"
        - "*visual*linear_fc1"
        - "*visual*linear_fc2"
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  optimizer:
    kwargs:
      lr: 1.0e-6

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/system-matched-vision-dpo/logs
  wandb:
    name: system-matched-vision-dpo-from-945
