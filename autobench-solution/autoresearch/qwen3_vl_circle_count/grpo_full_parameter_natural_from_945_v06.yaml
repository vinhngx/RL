# Full-rank vision-tower exact GRPO on the deployment-matched natural Gym
# distribution. This tests whether the 94.5% plateau is caused by the low-rank
# update subspace: vision weights are directly trainable while language weights
# are frozen, and every optimizer step is independently behavior-gated.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_matched_natural_exact_from_945_v06.yaml

grpo:
  max_num_steps: 4
  val_period: 1
  val_at_start: true
  val_at_end: true

loss_fn:
  reference_policy_kl_penalty: 0.20

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/full-rank-vision-natural-grpo/checkpoints
  save_period: 1
  keep_top_k: 4
  save_optimizer: false
  save_consolidated: true

policy:
  train_global_batch_size: 128
  train_micro_batch_size: 1
  logprob_batch_size: 1
  offload_optimizer_for_logprob: true
  dtensor_cfg:
    activation_checkpointing: true
    trainable_param_patterns:
      - "*visual*"
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: false
  optimizer:
    kwargs:
      lr: 5.0e-8
      weight_decay: 0.0
      betas: [0.9, 0.999]
      eps: 1.0e-8
      foreach: false
      fused: false

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/full-rank-vision-natural-grpo/logs
  wandb:
    name: full-rank-vision-natural-grpo-from-945
