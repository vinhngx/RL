# Point-grounded GRPO from the robust 190/200 leader. This follows the
# five-component cold-start recipe in Zeng et al.: format, point cardinality,
# Hungarian spatial alignment, point/count consistency, and exact count.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_pixel_location_from_94_v06.yaml

grpo:
  max_num_steps: 8

loss_fn:
  reference_policy_kl_penalty: 0.10

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/paper-grounded-multireward-from-950/checkpoints

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  optimizer:
    kwargs:
      lr: 5.0e-7

data:
  default:
    prompt_file: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/prompt_grounded_counting_multireward.txt

env:
  circle-count:
    num_workers: 4
    reward_functions:
      - name: grounded_counting_multireward
        weight: 1.0

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/paper-grounded-multireward-from-950/logs
  wandb:
    name: paper-grounded-multireward-from-950
