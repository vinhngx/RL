# Dense pixel-localization GRPO directly from the 94% counting leader.
# Restricting the update to the vision tower avoids the decoder regression
# observed when the same objective followed a full localization SFT warm-start.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_pixel_location_from_94_v06.yaml

grpo:
  max_num_steps: 16

loss_fn:
  reference_policy_kl_penalty: 0.10

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/direct-pixel-vision-grpo-from-94/checkpoints
  keep_top_k: 9

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/direction-matched-vlm-dpo-from-94/merged-parent
  dtensor_cfg:
    lora_cfg:
      enabled: true
      target_modules:
        - "*visual*attn.qkv"
        - "*visual*attn.proj"
        - "*visual*linear_fc1"
        - "*visual*linear_fc2"
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  optimizer:
    kwargs:
      lr: 1.0e-6

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/direct-pixel-vision-grpo-from-94/logs
  wandb:
    name: direct-pixel-vision-grpo-from-94
