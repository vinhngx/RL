# Exact GRPO calibration restricted to the language-model output head.
defaults: grpo_full_pool_replay_from_93_v06.yaml

grpo:
  max_num_steps: 8

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/lm-head-only-replay-from-93/checkpoints
  keep_top_k: 8

policy:
  dtensor_cfg:
    lora_cfg:
      target_modules:
        - "*lm_head"
      match_all_linear: false
  optimizer:
    kwargs:
      lr: 1.0e-5

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/lm-head-only-replay-from-93/logs
  wandb:
    name: grpo-lm-head-only-replay-from-93
