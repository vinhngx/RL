# Paired spatial-invariance GRPO from the 95% leader. Adjacent examples share
# layout and target count but place target-color circles at the edge vs center.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  max_num_steps: 4
  max_val_samples: 64
  val_period: 1
  val_at_start: false
  use_dynamic_sampling: false
  batch_multiplier: 1
  seed: 211
  counterfactual_pair_reward:
    enabled: true
    weight: 0.25
    expected_delta: 0

loss_fn:
  reference_policy_kl_penalty: 0.20

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/spatial-invariance-from-950/checkpoints
  save_period: 1
  keep_top_k: 4

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 1.0e-7

data:
  shuffle: false
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/spatial-invariance-from-950/data/train.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/spatial-invariance-from-950/logs
  wandb:
    name: spatial-invariance-grpo-from-950
