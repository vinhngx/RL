# Full-rank vision-tower exact GRPO from the 190/200 deployment checkpoint.
# One ~1,088-token sequence per dynamic microbatch avoids the narrow OOM that
# invalidated the earlier full-rank trial while retaining the full visual
# update subspace.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  max_num_steps: 4
  val_period: 1
  val_at_start: false
  val_at_end: true
  max_val_samples: 64
  seed: 173
  use_dynamic_sampling: true
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 2

loss_fn:
  reference_policy_kl_penalty: 0.20

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/full-rank-vision-natural-from-950/checkpoints
  save_period: 1
  keep_top_k: 4
  save_optimizer: false
  save_consolidated: true

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 128
  train_micro_batch_size: 1
  logprob_batch_size: 1
  offload_optimizer_for_logprob: true
  dynamic_batching:
    enabled: true
    train_mb_tokens: 1152
    logprob_mb_tokens: 1152
    sequence_length_round: 64
  dtensor_cfg:
    activation_checkpointing: true
    trainable_param_patterns:
      - "*visual*"
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: false
  optimizer:
    kwargs:
      lr: 2.0e-8
      weight_decay: 0.0
      betas: [0.9, 0.999]
      eps: 1.0e-8
      foreach: false
      fused: false
  generation:
    max_new_tokens: 128

data:
  shuffle: true
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-hard-negatives-from-950/data/candidate-pool.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/full-rank-vision-natural-from-950/logs
  wandb:
    name: full-rank-vision-natural-grpo-from-950
