# Standard GRPO with faithful image-example identity. Dynamic sampling removes
# all-correct/all-wrong groups so every retained update has empirical reward
# contrast within eight rollouts of the same image.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_vlm_group_id_rl_zvp_from_950_v06.yaml

grpo:
  max_num_steps: 2
  use_dynamic_sampling: true
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 2
  adv_estimator:
    name: grpo
    normalize_rewards: true
    use_leave_one_out_baseline: true

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/vlm-group-id-dynamic-grpo-from-950/checkpoints
  keep_top_k: 2

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/vlm-group-id-dynamic-grpo-from-950/logs
  wandb:
    name: vlm-group-id-dynamic-grpo-from-950
