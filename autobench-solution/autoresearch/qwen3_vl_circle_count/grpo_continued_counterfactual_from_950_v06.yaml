# Continue the exact vision-only counterfactual recipe that produced the
# 190/200 leader, but reset LoRA on the merged leader and reduce the learning
# rate for boundary-level refinement.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_counterfactual_pairs_from_945_v06.yaml

grpo:
  max_num_steps: 4
  val_period: 1
  val_at_start: false
  val_at_end: true
  max_val_samples: 64
  seed: 101

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/continued-counterfactual-from-950/checkpoints
  save_period: 1
  keep_top_k: 4

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 1.0e-7

data:
  shuffle: true

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/continued-counterfactual-from-950/logs
  wandb:
    name: continued-counterfactual-grpo-from-950-seed101
