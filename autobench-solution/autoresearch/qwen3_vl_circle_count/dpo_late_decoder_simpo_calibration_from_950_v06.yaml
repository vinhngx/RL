# Reference-free adjacent-answer calibration restricted to the final four text
# decoder layers. Vision weights and the output head remain frozen.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/dpo_vision_simpo_margin_from_950_v06.yaml

dpo:
  max_num_steps: 8
  val_period: 1
  val_batches: 1
  val_global_batch_size: 32
  val_micro_batch_size: 1

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/late-decoder-simpo-calibration-from-950/checkpoints
  save_period: 1
  keep_top_k: 8

policy:
  dtensor_cfg:
    activation_checkpointing: false
    lora_cfg:
      enabled: true
      target_modules:
        - "*language_model.layers.24.*"
        - "*language_model.layers.25.*"
        - "*language_model.layers.26.*"
        - "*language_model.layers.27.*"
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 16
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  optimizer:
    kwargs:
      lr: 5.0e-7

data:
  shuffle: true
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/late-decoder-simpo-calibration-from-950/data/train.jsonl
  validation:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/late-decoder-simpo-calibration-from-950/data/validation.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/late-decoder-simpo-calibration-from-950/logs
  wandb:
    name: late-decoder-simpo-calibration-from-950
