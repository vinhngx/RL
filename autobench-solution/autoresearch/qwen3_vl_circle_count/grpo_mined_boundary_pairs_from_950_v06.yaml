# Exact + adjacent-count consistency GRPO around on-policy failure boundaries.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_spatial_invariance_from_950_v06.yaml

grpo:
  max_num_steps: 6
  seed: 401
  counterfactual_pair_reward:
    enabled: true
    weight: 0.5
    expected_delta: 1

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/mined-boundary-pairs-from-950/checkpoints
  keep_top_k: 6

policy:
  optimizer:
    kwargs:
      lr: 2.0e-7

data:
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/mined-boundary-pairs-from-950/data/train.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/mined-boundary-pairs-from-950/logs
  wandb:
    name: mined-boundary-pairs-grpo-from-950
