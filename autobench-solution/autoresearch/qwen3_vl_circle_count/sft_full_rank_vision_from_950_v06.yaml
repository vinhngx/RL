defaults: ../../sft.yaml

sft:
  max_num_epochs: 1
  max_num_steps: 8
  val_period: 2
  val_batches: 1
  val_global_batch_size: 16
  val_micro_batch_size: 1
  val_at_start: false
  val_at_end: true
  seed: 42
  only_unmask_final: false

checkpointing:
  enabled: true
  checkpoint_dir: /runstate/checkpoints
  metric_name: val:val_loss
  higher_is_better: false
  keep_top_k: 4
  save_period: 2
  save_optimizer: false

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
    chat_template: default
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 16
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  precision: bfloat16
  make_sequence_length_divisible_by: 1
  dtensor_cfg:
    _v2: true
    enabled: true
    env_vars: {}
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    automodel_kwargs:
      freeze_config:
        freeze_vision_tower: false
        freeze_language_model: true
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: false
      dim: 8
      alpha: 8
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: false
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 1.0e-7
      weight_decay: 0.0
      betas: [0.9, 0.95]
      eps: 1.0e-8
      foreach: false
      fused: false
  scheduler:
    - name: torch.optim.lr_scheduler.ConstantLR
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: []
  megatron_cfg:
    enabled: false

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  train:
    dataset_name: circle-count-sft
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-match-external/github-dataset-verbatim/data/sft-train.jsonl
  validation:
    dataset_name: circle-count-sft
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-match-external/github-dataset-verbatim/data/sft-val.jsonl
  default:
    processor: sft_processor
    prompt_file: null

logger:
  log_dir: /runstate/logs
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: qwen3-vl-circle-count-autoresearch
    name: full-rank-vision-sft-from-950

cluster:
  gpus_per_node: 1
  num_nodes: 1
  segment_size: null
