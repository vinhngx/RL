# Dense ordinal process-reward GRPO from the 190/200 leader. Six monotone
# count-threshold decisions provide absolute calibration signal while the
# canonical boxed total remains the selection target.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  max_num_steps: 8
  val_period: 1
  val_at_start: true
  val_at_end: true
  seed: 590

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/ordinal-process-grpo-v2-from-950/checkpoints
  save_period: 1
  keep_top_k: 8

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 2.5e-7
  generation:
    max_new_tokens: 128

data:
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/ordinal-process-grpo-v2-from-950/data/train.jsonl

env:
  circle-count:
    num_workers: 4
    reward_functions:
      - name: ordinal_count
        weight: 1.0

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/ordinal-process-grpo-v2-from-950/logs
  wandb:
    name: ordinal-process-grpo-v2-from-950
