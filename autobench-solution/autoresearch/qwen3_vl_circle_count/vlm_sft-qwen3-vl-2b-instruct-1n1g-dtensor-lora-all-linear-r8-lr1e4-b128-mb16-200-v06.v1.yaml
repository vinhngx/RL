defaults: vlm_sft-qwen3-vl-2b-instruct-1n1g-dtensor1tp1-b128-200.v1.yaml

sft:
  val_period: 10

checkpointing:
  save_period: 10

policy:
  train_micro_batch_size: 16
  dtensor_cfg:
    activation_checkpointing: true
    lora_cfg:
      enabled: true
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 1.0e-4
      weight_decay: 0.1
      betas: [0.9, 0.98]
      eps: 1.0e-5
      foreach: false
      fused: false

logger:
  wandb:
    project: qwen3-vl-circle-count-autoresearch
    name: sft-2b-lora-all-linear-r8-lr1e4-b128-mb16-200-v06
