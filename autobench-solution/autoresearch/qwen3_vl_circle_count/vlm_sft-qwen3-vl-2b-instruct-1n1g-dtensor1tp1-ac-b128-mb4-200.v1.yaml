defaults: vlm_sft-qwen3-vl-2b-instruct-1n1g-dtensor1tp1-b128-200.v1.yaml

# One-step boundary candidate on one 44.42-GiB L40S. Microbatch 8 OOMed in
# step-1 backward. Microbatch 4 completed step 1, then OOMed in step-2 forward
# after optimizer state had materialized. Retained for reproducibility only.
policy:
  train_micro_batch_size: 4
  dtensor_cfg:
    activation_checkpointing: true

logger:
  wandb:
    project: qwen3-vl-circle-count-autoresearch
    name: sft-2b-full-ac-b128-mb4-200-dtensor
