# One-step exact GRPO with a small paired count-difference consistency bonus.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  num_prompts_per_step: 16
  max_num_steps: 1
  val_period: 1
  val_at_start: false
  use_dynamic_sampling: false
  batch_multiplier: 1
  counterfactual_pair_reward:
    enabled: true
    weight: 0.25

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/pair-consistency-grpo/checkpoints
  save_period: 1

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 1.0e-7

data:
  shuffle: false
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/data/train.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/pair-consistency-grpo/logs
  wandb:
    name: pair-consistency-grpo-from-950
