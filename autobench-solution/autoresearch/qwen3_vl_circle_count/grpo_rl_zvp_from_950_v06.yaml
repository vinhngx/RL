# RL-ZVP on a deployment-matched natural pool from the robust 190/200 leader.
# Mixed-reward groups use standard GRPO. All-correct/all-wrong groups receive
# the paper's entropy-shaped token advantages, using a top-64 approximation.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/reinforcepp_global_balanced_from_950_v06.yaml

grpo:
  max_num_steps: 1
  use_dynamic_sampling: false
  adv_estimator:
    name: rl_zvp
    normalize_rewards: true
    use_leave_one_out_baseline: true
    alpha: 0.1
    entropy_top_k: 64

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/rl-zvp-from-950/checkpoints

policy:
  optimizer:
    kwargs:
      lr: 1.25e-7

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/rl-zvp-from-950/logs
  wandb:
    name: rl-zvp-from-950
