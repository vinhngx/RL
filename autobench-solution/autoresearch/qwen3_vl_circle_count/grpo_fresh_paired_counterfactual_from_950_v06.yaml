# Fresh paired exact-reward continuation from the robust 190/200 leader.
# Unlike the earlier continuation, adjacent base/+1 images remain co-batched:
# their shared nuisance factors cancel in each global update while the changed
# target circle supplies the only systematic visual difference.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_counterfactual_pairs_from_945_v06.yaml

grpo:
  max_num_steps: 4
  val_period: 1
  val_at_start: true
  val_at_end: true
  max_val_samples: 200
  seed: 271

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-paired-counterfactual-from-950/checkpoints
  save_period: 1
  keep_top_k: 4

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/counterfactual-pair-grpo/merged-step2
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 2.5e-7

data:
  shuffle: false
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-paired-counterfactual-from-950/data/train.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-paired-counterfactual-from-950/logs
  wandb:
    name: fresh-paired-counterfactual-grpo-from-950
