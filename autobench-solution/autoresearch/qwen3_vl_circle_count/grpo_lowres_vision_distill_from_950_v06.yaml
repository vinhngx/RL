# Distill the leader's complementary low-resolution visual behavior into a
# vision-only adapter, then evaluate that adapter with the canonical native
# processor. No resize or auxiliary component is used at inference.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/grpo_edge_aware_exact_from_94_v06.yaml

grpo:
  max_num_steps: 2
  val_period: 1
  val_at_start: true
  val_at_end: true
  max_val_samples: 200
  seed: 313

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/lowres-vision-distill-from-950/checkpoints
  save_period: 1
  keep_top_k: 2

policy:
  model_name: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/lowres-vision-distill-from-950/lowres-parent
  tokenizer:
    name: ${policy.model_name}
  optimizer:
    kwargs:
      lr: 5.0e-7

data:
  shuffle: true
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/fresh-hard-negatives-from-950/data/candidate-pool.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/lowres-vision-distill-from-950/logs
  wandb:
    name: lowres-vision-distill-from-950
