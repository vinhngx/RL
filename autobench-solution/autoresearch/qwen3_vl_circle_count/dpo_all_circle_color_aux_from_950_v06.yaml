# Exact boxed-token paired-image SimPO plus training-only eight-way color
# classification at every known circle-center visual token.
defaults: /workspace/RL/autobench-solution/autoresearch/qwen3_vl_circle_count/dpo_counterfactual_boxed_token_vision_simpo_from_950_v06.yaml

dpo:
  max_num_steps: 8
  val_period: 1
  val_batches: 3
  val_global_batch_size: 16
  val_micro_batch_size: 2

checkpointing:
  checkpoint_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/all-circle-color-aux-v2-from-950/checkpoints
  save_period: 1
  keep_top_k: 8

policy:
  train_global_batch_size: 16
  train_micro_batch_size: 2
  dtensor_cfg:
    activation_checkpointing: true
    circle_color_aux:
      enabled: true
      merge_size: 2
      temperature: 0.05
      weight: 0.005
      # red, blue, green, yellow, purple, orange, cyan, pink
      color_token_ids: [2518, 6303, 6176, 13753, 24932, 18575, 57888, 18217]
  optimizer:
    kwargs:
      lr: 2.5e-7

data:
  shuffle: false
  train:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/all-circle-color-aux-from-950/data/train.jsonl
  validation:
    data_path: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/all-circle-color-aux-from-950/data/validation.jsonl

logger:
  log_dir: /brev/nemo-rl-auto-research/20260907-qwen3-vl-2b-grpo-98/all-circle-color-aux-v2-from-950/logs
  wandb:
    name: all-circle-color-aux-v2-from-950
